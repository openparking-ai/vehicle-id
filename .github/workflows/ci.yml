name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: No real personal data in the repository
        run: |
          node .github/scripts/check-no-real-data.js --self-test
          node .github/scripts/check-no-real-data.js

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest version supported and a current one. This runs on whatever
        # the Jetson image ships; the tests must not quietly depend on a newer
        # interpreter than that.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install WITHOUT the engine extra
        # Deliberate. A consumer integrating against this product gets the
        # contract, the service, the push queue and the CLI with no torch and no
        # OpenCV, and this job is what proves that claim stays true. If a test
        # below ever needs the engine, the contract has stopped standing alone.
        run: pip install -e '.[dev]'

      - name: The contract stands alone
        run: |
          python -c "import vehicle_id.contract, vehicle_id.service, vehicle_id.push"
          python - <<'PY'
          import importlib.util
          for forbidden in ("torch", "cv2"):
              assert importlib.util.find_spec(forbidden) is None, (
                  f"{forbidden} is installed in the no-engine job; "
                  "this job no longer proves the contract stands alone"
              )
          PY

      - name: Tests
        # The contract, the service and the push queue only. Everything that
        # needs OpenCV or torch skips here, including the presence guarantees --
        # named, because an unnamed skip of a guarantee test now fails the run.
        env:
          VEHICLE_ID_ALLOW_SKIPPED: "could not import"
        run: pytest -q

  engine:
    name: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,engine]'

      - name: Train a small recogniser
        # Weights are not committed, so CI builds its own. Small and short --
        # this proves the pipeline and the never-wrong-silently guarantee, not
        # the accuracy numbers, which come from the full harness run recorded
        # in the receipt.
        run: |
          python -m vehicle_id.plates.train \
            --steps 600 --train-size 4000 --batch-size 32 --device cpu

      - name: Make a folder of images to evaluate
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          from vehicle_id.plates.generator import PlateGenerator
          out = Path("/tmp/plates"); out.mkdir(exist_ok=True)
          for i, sample in enumerate(PlateGenerator(seed=5).batch(3)):
              cv2.imwrite(str(out / f"plate{i}.png"), sample.image)
          PY

      - name: Is the presence gate CONNECTED? No weights needed, so no skips
        # BEFORE the model is trained, deliberately. Whether the gate is wired
        # into the engine is answerable with a stub recogniser at a fixed
        # confidence, and keeping it answerable without weights is what stops it
        # skipping -- three of these guarantees skipped in every run for a
        # fortnight while this job stayed green.
        #
        # No VEHICLE_ID_ALLOW_SKIPPED here on purpose: nothing in these files is
        # allowed to skip in this job, and the run fails if it does.
        run: pytest tests/test_presence_wiring.py tests/test_presence.py -q

      - name: Engine tests, including never-wrong-silently
        # The accuracy half, which genuinely needs weights better than the small
        # model this job trains. The skips are DECLARED: an unnamed skip of a
        # @guarantee test fails the run.
        env:
          VEHICLE_ID_ALLOW_SKIPPED: "needs weights"
        run: pytest tests/test_plates.py -q

      - name: The harness runs, reports, and records the operating point
        # --write-operating-point is what lets the engine start below. The
        # engine refuses to run on weights whose operating point nobody has
        # measured, rather than stamping a constant onto records produced by a
        # model it was not measured for.
        run: |
          python scripts/eval_plates.py --per-rung 40 --skip-baseline \
            --write-operating-point

      - name: An unmeasured model must refuse to start
        # The control for the step above. If the engine would happily run
        # without a measured operating point, recording one proves nothing.
        run: |
          cp models/plate_crnn.pt /tmp/unmeasured.pt
          if python -m vehicle_id.cli read /tmp/plates --weights /tmp/unmeasured.pt; then
            echo "engine started on weights with no measured operating point"; exit 1
          fi
          echo "refused, as required"

      - name: Every published figure is still the measured one
        # The documentation fail-control. `eval_presence.py` re-measures what the
        # gate does and the check compares it with what README.md and
        # docs/CONTRACT.md say. A figure edited by hand turns this red.
        #
        # The noise rates need real weights, so this run measures the gate's
        # geometry and keeps the recorded rates; the comparison still covers
        # both, because the evidence file is committed.
        run: |
          python scripts/eval_presence.py --weights models/plate_crnn.pt
          git diff --exit-code docs/measured/presence.json || {
            echo "the gate's measured geometry has changed but docs/measured/presence.json was not updated"
            echo "run: python scripts/eval_presence.py --update-docs"
            exit 1
          }
          pytest tests/test_measured_docs.py -q

      - name: The CLI reads a folder with no system present
        # The definition of done, run as a check: someone with no parking
        # system points this at images and gets records back.
        run: python -m vehicle_id.cli read /tmp/plates
