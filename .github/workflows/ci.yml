name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: No real personal data in the repository
        run: |
          node .github/scripts/check-no-real-data.js --self-test
          node .github/scripts/check-no-real-data.js

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest version supported and a current one. This runs on whatever
        # the Jetson image ships; the tests must not quietly depend on a newer
        # interpreter than that.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install WITHOUT the engine extra
        # Deliberate. A consumer integrating against this product gets the
        # contract, the service, the push queue and the CLI with no torch and no
        # OpenCV, and this job is what proves that claim stays true. If a test
        # below ever needs the engine, the contract has stopped standing alone.
        run: pip install -e '.[dev]'

      - name: The contract stands alone
        run: |
          python -c "import vehicle_id.contract, vehicle_id.service, vehicle_id.push"
          python - <<'PY'
          import importlib.util
          for forbidden in ("torch", "cv2"):
              assert importlib.util.find_spec(forbidden) is None, (
                  f"{forbidden} is installed in the no-engine job; "
                  "this job no longer proves the contract stands alone"
              )
          PY

      - name: Tests
        # The contract, the service and the push queue only. Everything that
        # needs OpenCV or torch skips here, including the presence guarantees --
        # named, because an unnamed skip of a guarantee test now fails the run.
        env:
          VEHICLE_ID_ALLOW_SKIPPED: "could not import"
        run: pytest -q

  engine:
    name: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,engine]'

      - name: Train a small recogniser
        # Weights are not committed, so CI builds its own. Small and short --
        # this proves the pipeline and the never-wrong-silently guarantee, not
        # the accuracy numbers, which come from the full harness run recorded
        # in the receipt.
        run: |
          python -m vehicle_id.plates.train \
            --steps 600 --train-size 4000 --batch-size 32 --device cpu

      - name: Make a folder of images to evaluate
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          from vehicle_id.plates.generator import PlateGenerator
          out = Path("/tmp/plates"); out.mkdir(exist_ok=True)
          for i, sample in enumerate(PlateGenerator(seed=5).batch(3)):
              cv2.imwrite(str(out / f"plate{i}.png"), sample.image)
          PY

      - name: Is the presence gate CONNECTED, and does it MOVE the number?
        # Both halves, and neither needs weights. Connectedness is a stub
        # recogniser at a fixed confidence; "the gate moves the number" is the
        # same stub answering every noisy frame confidently, so the ungated
        # control is satisfied by construction instead of by luck. The accuracy
        # version in test_plates.py may skip; this may not, and the run below
        # names no allowance on purpose.
        run: pytest tests/test_presence_wiring.py tests/test_presence.py tests/test_skip_guard.py -q

      - name: The appearance descriptor, its matcher, and what it may be built from
        # Needs OpenCV and NO weights, which is the point: the descriptor is
        # classical, so every one of its properties is provable from images the
        # tests invent. No allowance is named here on purpose -- nothing in
        # these three modules has a reason to skip in this job, and a skip
        # should stop the build.
        #
        # The dependency module is the licence position as a check: a live
        # patent (SURF), descriptors that download weights at runtime
        # (xfeatures2d's VGG/BoostDesc/BEBLID/TEBLID), and GPLv3-with-a-paid-
        # exception (libpHash). Its positive control plants a contrib
        # distribution on sys.path and requires the probe to see it, because on
        # a headless build "contrib is absent" passes for free.
        run: |
          pytest tests/test_fingerprint.py tests/test_fingerprint_dependencies.py \
                 tests/test_eval_fingerprint.py -q

      - name: The pair harness RUNS, end to end, on a synthetic pair set
        # Round A's whole output is a number produced by this harness, and the
        # photographs it needs do not exist yet. So what CI can prove -- and
        # does, here -- is that the harness runs: descriptors, every
        # comparison, the fit/report split, the chooser, the bounds, the tie
        # count, the guard and the writer.
        #
        # /tmp is outside every git work tree, which is the harness's own
        # precondition; pointed inside one it refuses, and that refusal is
        # tested above. Two of the six pairs are FLAT, so the UNMEASURABLE
        # outcome is exercised in both halves of the split rather than assumed
        # reachable.
        #
        # Everything it writes is marked `synthetic: true` and
        # `is_a_measurement_of_real_vehicles: false`. These numbers are invented
        # and may never be quoted as the answer.
        run: |
          python scripts/eval_fingerprint.py --write-synthetic /tmp/fp-pairs \
            --pairs 6 --flat 2
          python scripts/eval_fingerprint.py \
            --photos /tmp/fp-pairs --index /tmp/fp-pairs/index.json \
            --out /tmp/fp-evidence.json | tee /tmp/fp.txt
          grep -q "SYNTHETIC" /tmp/fp.txt || {
            echo "a synthetic run did not say so"; exit 1; }
          python - <<'PY'
          import json, sys
          obj = json.load(open("/tmp/fp-evidence.json"))
          assert obj["synthetic"] is True
          assert obj["is_a_measurement_of_real_vehicles"] is False
          unmeasurable = sum(
              obj["arms"]["structure"]["distances"][k]["unmeasurable"]
              for k in ("same_car", "different_car")
          )
          assert unmeasurable > 0, (
              "no comparison was unmeasurable, so the third outcome was not "
              "exercised and this run proves less than it appears to"
          )
          print(f"harness ran; {unmeasurable} unmeasurable comparisons, as intended")
          PY

      - name: The harness REFUSES to read or write inside a repository
        # The no-real-data rule, as a check rather than a convention.
        # `check-no-real-data.js` scans TRACKED files and can never see a
        # photograph outside the tree, so this is the half that protects the
        # photographs themselves.
        run: |
          if python scripts/eval_fingerprint.py --photos . --index /tmp/fp-pairs/index.json \
               --out /tmp/x.json; then
            echo "the harness read photographs from inside the repository"; exit 1
          fi
          echo "refused, as required"

      - name: Engine tests, including never-wrong-silently
        # The accuracy half, which genuinely needs weights better than the small
        # model this job trains. The skips are DECLARED: an unnamed skip of a
        # @guarantee test fails the run.
        env:
          VEHICLE_ID_ALLOW_SKIPPED: "needs weights"
        run: pytest tests/test_plates.py -q

      - name: The harness runs, and REFUSES an operating point to a model that cannot read
        # The chooser's constraints, exercised end to end rather than only in
        # tests/test_operating_point.py.
        #
        # This job trains a 600-step model to prove the pipeline. That model
        # reads no pristine plate correctly, so its clean-plate confidence is
        # 0.0000, and no threshold can both keep silent-wrong under 1% and stay
        # at or below that. A refusal naming the numbers is the correct output.
        #
        # Until this round the harness chose on silent-wrong ALONE and would
        # have written 0.500 here: a threshold nothing clears, recorded in a
        # sidecar as though it had been measured. The same rule wrote 0.995 for
        # a real retrained checkpoint whose pristine plates answer only at 0.99.
        run: |
          python scripts/eval_plates.py --per-rung 40 --skip-baseline \
            --write-operating-point | tee /tmp/eval.txt
          grep -q "REFUSED" /tmp/eval.txt || {
            echo "the harness chose an operating point for a model that reads nothing"; exit 1; }
          grep -q "NOT written" /tmp/eval.txt || {
            echo "the harness refused and wrote a sidecar anyway"; exit 1; }
          test ! -f models/plate_crnn.operating-point.json || {
            echo "a sidecar exists after a refusal"; exit 1; }
          echo "refused, as required, and wrote nothing"

      - name: Record a PIPELINE operating point for the smoke model
        # Not a measurement, and the sidecar says so in the evidence block.
        #
        # The steps below prove plumbing -- the engine starts on weights whose
        # operating point exists, refuses when it does not, and the CLI reads a
        # folder -- and that needs a sidecar. The harness correctly refuses to
        # produce one for a model this small, so it is written here, explicitly,
        # by hand, at a threshold this model never clears. Every read below is
        # therefore a FALLBACK, which is the first-class answer the README shows
        # and exactly what the previous auto-written 0.500 produced.
        #
        # Writing it here rather than loosening the chooser is the point: the
        # exception is one visible step in one job, not a rule the release path
        # also travels.
        run: |
          python - <<'PY'
          from pathlib import Path
          from vehicle_id.engine import write_operating_point
          path = write_operating_point(
              Path("models/plate_crnn.pt"),
              0.5,
              {
                  "measured": False,
                  "why": "CI pipeline fixture, NOT a measured operating point. "
                         "The 600-step model this job trains reads no plate "
                         "correctly and the harness refuses it an operating "
                         "point. Every read at this threshold is a fallback.",
              },
              same_vehicle_spread=0.0,
              noise_confidence_ceiling=0.0,
          )
          print(f"wrote {path}")
          PY

      - name: An unmeasured model must refuse to start
        # The control for the step above. If the engine would happily run
        # without a measured operating point, recording one proves nothing.
        run: |
          cp models/plate_crnn.pt /tmp/unmeasured.pt
          if python -m vehicle_id.cli read /tmp/plates --weights /tmp/unmeasured.pt; then
            echo "engine started on weights with no measured operating point"; exit 1
          fi
          echo "refused, as required"

      - name: Every published figure AND SENTENCE is still the measured one
        # The documentation fail-control. `eval_presence.py` re-measures what the
        # gate does and the check compares it with what README.md and
        # docs/CONTRACT.md say. A figure edited by hand turns this red.
        #
        # It now covers the SENTENCES too, and that is not a refinement. The
        # previous release stated a correct measured figure -- "`false` up to 5%
        # streak coverage" -- and, in the hand-written words beside it, "and
        # stops answering above that", which the same evidence file contradicted:
        # there is a `true` band from 10% to 25% in which an empty lane reads as
        # occupied. A true number lent its credibility to a false sentence in
        # both published documents and nothing here could see it. Sections
        # describing measured behaviour are generated as `<!--mb:-->` blocks now,
        # and this compares them the same way it compares the numbers.
        #
        # It also checks the evidence file's own booleans: every one published as
        # `true` must name a control, and every control must actually be false.
        # `never_refuses_in_weather` was `all(x is not False or True ...)` for two
        # rounds -- true for every input in the universe -- and it was the
        # module's load-bearing safety property.
        #
        # NOTE what this deliberately does NOT do: re-measure the noise rates.
        # It used to, and it was wrong. Those rates describe a RECOGNISER, this
        # job trains a 600-step model at the same path the release weights live
        # at, and that model answers zero on noise -- so the job replaced a
        # figure measured on one model with a figure measured on another and
        # reported the difference as drift. A comparison between two different
        # models is not a check. Re-measuring is now an explicit act
        # (`--measure-noise`) performed with real weights, and the rates carry
        # the digest of the weights that produced them.
        run: |
          python scripts/eval_presence.py
          git diff --exit-code docs/measured/presence.json || {
            echo "the gate's measured geometry has changed but docs/measured/presence.json was not updated"
            echo "run: python scripts/eval_presence.py --update-docs"
            exit 1
          }
          pytest tests/test_measured_docs.py -q

      - name: No published rate without the artefact it was measured on
        # G4a as a check rather than a convention. A rate whose weights nobody
        # recorded cannot be reproduced, compared, or believed -- the contract
        # demands `weights_id` of every record the engine emits, and a figure in
        # a document is held to the same standard.
        run: |
          python - <<'PY'
          import json, sys
          noise = json.load(open("docs/measured/presence.json")).get("noise")
          if noise is None:
              print("no noise rates recorded; nothing to check"); sys.exit(0)
          digest = noise.get("weights_id")
          assert digest and digest.startswith("sha256:"), (
              f"the published noise rates name no weights ({digest!r}). "
              "Re-measure with: python scripts/eval_presence.py --measure-noise "
              "--weights <the real weights>"
          )
          print(f"noise rates measured on {digest}")
          PY

      - name: The CLI reads a folder with no system present
        # The definition of done, run as a check: someone with no parking
        # system points this at images and gets records back.
        run: python -m vehicle_id.cli read /tmp/plates
